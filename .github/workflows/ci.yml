name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Type check
        run: python -m mypy app/passwords.py app/totp.py app/backup.py app/vehicle.py app/tenancy.py
      - name: Syntax
        run: python -m compileall -q app tests
      - name: Tests
        run: python -m pytest -q
        env:
          TIC_CLIENT_SECRETS: '{"demo:guardian":"development-change-me","demo:arxvigil":"development-change-me-too"}'
          TIC_DATA_KEY: "ci-data-key"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: techne
          POSTGRES_PASSWORD: techne
          POSTGRES_DB: techne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techne -d techne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Live PostgreSQL transaction
        run: python -m pytest -q tests/test_postgres_live.py
        env:
          TIC_POSTGRES_URL: postgresql+psycopg://techne:techne@localhost:5432/techne
          TIC_DATA_KEY: "ci-data-key"
