# Development only. These passwords and client secrets are refused when TIC_ENV=production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: techne
      POSTGRES_PASSWORD: techne
      POSTGRES_DB: techne
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techne -d techne"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://techne:techne@db:5432/techne
      TIC_CLIENT_SECRETS: '{"demo:guardian":"development-change-me","demo:arxvigil":"development-change-me-too"}'
      TIC_ENV: development
      TIC_WORKER: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
